name: Refresh Dispatch tracker

on:
  schedule:
    - cron: '23 * * * *'     # every hour: player counts need several samples a day for a real peak
  workflow_dispatch: {}       # manual run from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Sample liked games on Steam (players + reviews)
        run: node scripts/fetch-tracker.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tracker.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh tracker.json [skip ci]"
          # Other workflows push too: rebase onto them if needed.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
