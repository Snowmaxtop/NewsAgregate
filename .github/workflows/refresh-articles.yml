name: Refresh Dispatch articles

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# One run at a time: a slow run is never overlapped by the next one.
concurrency:
  group: dispatch-articles
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Exact versions from package-lock.json (integrity-checked), and no
      # install scripts: a compromised package can't run code at install.
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Fetch feeds and build articles.json + archive
        run: node scripts/fetch-articles.mjs

      - name: Commit and push articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if [ -d archive ]; then git add archive; fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh articles.json + archive [skip ci]"
          # Other workflows push too: rebase onto them (they never touch these files).
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # Separate step on a fresh copy: the app may save dispatch-state.json
      # at any moment. If it does, this clean-up is skipped and retried on
      # the next run; the articles above are already published.
      - name: Purge old read/deleted links from the sync file
        run: |
          git pull --rebase origin "${GITHUB_REF_NAME}"
          node scripts/purge-state.mjs
          git add dispatch-state.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "chore: purge old links from dispatch-state.json [skip ci]"
          if ! git push; then
            echo "The app saved the sync file meanwhile: purge skipped, next run retries."
            git reset --hard "origin/${GITHUB_REF_NAME}"
          fi

      - name: Push notification for new articles
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_DELAY_S: '60'   # let GitHub Pages publish the new articles.json first
        run: node scripts/send-push.mjs

      - name: Save notification state
        run: |
          if [ -f push-state.json ]; then git add push-state.json; fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: push-state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
