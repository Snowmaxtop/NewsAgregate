name: Refresh Dispatch articles

on:
  schedule:
    - cron: '*/20 * * * *'   # every 20 minutes
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install fast-xml-parser

      - name: Fetch feeds and build articles.json (+ purge state)
        run: node scripts/fetch-articles.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # dispatch-state.json only changes when the server-side purge
          # removed something; archive/ only when new articles appeared.
          git add articles.json dispatch-state.json
          if [ -d archive ]; then git add archive; fi
          git diff --staged --quiet && exit 0
          git commit -m "chore: refresh articles.json + archive [skip ci]"
          # Other workflows (releases, tracker) push too: rebase onto them if needed.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
